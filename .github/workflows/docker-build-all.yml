name: Build GeoLibre Full Stack, Push Docker Hub & Upload to Google Drive

on:
  workflow_dispatch: # 🎯 支持 GitHub Actions 页面手动触发

jobs:
  build-push-and-upload:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: geolibre-web
            context: .
            dockerfile: Dockerfile
          - name: geolibre-server
            context: backend/geolibre_server_api
            dockerfile: backend/geolibre_server_api/Dockerfile
          - name: geolibre-collab
            context: .
            dockerfile: workers/collab-node/Dockerfile

    steps:
      # 1️⃣ 检出仓库代码
      - name: 🐙 Checkout Repository
        uses: actions/checkout@v4.2.2

      # 2️⃣ 清理 Runner 磁盘空间（避免编译多架构镜像时爆空间）
      - name: 🧹 Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: true

      # 3️⃣ 配置 QEMU（模拟 arm64 交叉编译）
      - name: 🐢 Setup QEMU
        uses: docker/setup-qemu-action@v3

      # 4️⃣ 初始化 Docker Buildx
      - name: 🛠️ Setup Docker Buildx
        uses: docker/setup-buildx-action@v3.10.0

      # 5️⃣ 登录到 Docker Hub
      - name: 🔑 Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 6️⃣ 生成 Docker 标签与元数据
      - name: 🏷️ Extract Metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.name }}
          tags: |
            type=raw,value=latest

      # 7️⃣ 多架构编译并推送到 Docker Hub (amd64 + arm64)
      - name: 🚀 Build and Push Multi-Arch Image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 8️⃣ 安装导出与传输依赖项
      - name: 📦 Install Packaging Dependencies
        run: |
          sudo apt update
          sudo apt install -y gzip xz-utils curl

      # 9️⃣ 安装 rclone
      - name: ⚡ Install rclone
        run: |
          curl https://rclone.org/install.sh | sudo bash

      # 🔟 部署 rclone 配置文件
      - name: ⚙️ Setup rclone Config
        env:
          RCLONE_SECRET_DATA: ${{ secrets.GOOGLE_FSXEDX_DRIVE }}
        run: |
          mkdir -p ~/.config/rclone
          echo "$RCLONE_SECRET_DATA" > ~/.config/rclone/rclone.conf

      # 1️⃣1️⃣ 验证 rclone 连通性
      - name: 🔍 Verify rclone Status
        run: |
          rclone version
          rclone listremotes

      # 1️⃣2️⃣ 为离线备份导出本服务镜像（amd64 架构副本）
      - name: 🏗️ Export Local Image Archive for Backup
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --file ${{ matrix.dockerfile }} \
            --tag ${{ matrix.name }}:latest \
            --output type=docker,dest=${{ matrix.name }}_amd64.tar \
            ${{ matrix.context }}

      # 1️⃣3️⃣ 极限压缩备份包 (.tar.xz)
      - name: 🗜️ Compress Archive with xz
        run: |
          xz -T0 -6 ${{ matrix.name }}_amd64.tar
          ls -lh ${{ matrix.name }}_amd64.tar.xz

      # 1️⃣4️⃣ 创建 Google Drive 目标目录
      - name: 📁 Create Google Drive Directory
        run: |
          rclone mkdir feadxus-Google-Drive:/backup/geolibre || true

      # 1️⃣5️⃣ 上传备份包到 Google Drive
      - name: ☁️ Upload Archive to Google Drive
        run: |
          rclone copy \
            ${{ matrix.name }}_amd64.tar.xz \
            feadxus-Google-Drive:/backup/geolibre/ \
            --progress

      # 1️⃣6️⃣ 校验网盘传输文件
      - name: ✅ Verify Google Drive Upload
        run: |
          echo "🎉 ${{ matrix.name }} 备份成功! 当前网盘文件清单:"
          rclone lsf feadxus-Google-Drive:/backup/geolibre/
